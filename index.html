<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>網址轉 QR Code</title>
<style>
  :root{--ink:#14213d;--paper:#f7f9fc;--line:#c9d3e3;--accent:#ffb703;--err:#b3261e}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;
       background:var(--paper);color:var(--ink);
       font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
  main{width:100%;max-width:480px}
  h1{font-size:1.75rem;margin:0 0 8px;letter-spacing:.02em}
  p.lead{margin:0 0 24px;line-height:1.6}
  form{display:flex;gap:8px;flex-wrap:wrap}
  input[type=text]{flex:1 1 220px;padding:12px 14px;font-size:1rem;border:2px solid var(--ink);
       border-radius:6px;background:#fff;color:var(--ink)}
  button,a.btn{padding:12px 18px;font-size:1rem;font-weight:700;border:2px solid var(--ink);
       border-radius:6px;background:var(--accent);color:var(--ink);cursor:pointer;text-decoration:none}
  button:hover,a.btn:hover{background:var(--ink);color:#fff}
  :focus-visible{outline:3px solid var(--ink);outline-offset:2px}
  .error{margin-top:12px;color:var(--err);font-weight:600}
  .result{margin-top:28px;padding:20px;background:#fff;border:2px solid var(--ink);border-radius:6px;text-align:center}
  .result img{width:100%;max-width:320px;height:auto;image-rendering:pixelated}
  .target{margin:12px 0 16px;word-break:break-all;font-size:.9rem;color:#4a5875}
</style>
</head>
<body>
<main>
  <h1>網址轉 QR Code</h1>
  <p class="lead">貼上網址，馬上產生可以掃描的 QR Code。</p>

  <form method="post">
    <input type="text" name="url" value="{{ url or '' }}" placeholder="https://example.com"
           aria-label="網址" required autofocus>
    <button type="submit">產生 QR Code</button>
  </form>

  {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}

  {% if qr_image %}
  <section class="result">
    <img src="{{ qr_image }}" alt="{{ url }} 的 QR Code">
    <div class="target">{{ url }}</div>
    <a class="btn" href="{{ qr_image }}" download="qrcode.png">下載圖片</a>
  </section>
  {% endif %}
</main>
</body>
</html>
